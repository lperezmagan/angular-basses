<h4>Listado</h4>
    <ul class="list-group">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"

        [ngClass]="{
          'list-group-item-success': isOdd,
          'list-group-item-dark': isEven
        }"

        *ngFor="let characterItem of characterList;
        let indice = index;
        let isFirst = first;
        let isLast = last;
        let isOdd = odd;
        let isEven = even
        ">

        <div>
          <span class="text-primary"> {{ indice +1 }}. </span>
          <span>{{ characterItem.name }}</span>-
          <span><strong>power: </strong>{{ characterItem.power}}</span>
        </div>

        <button
          class="btn btn-danger ml-2"
          (click)="onDeleteCharacter(characterItem.id)"
          >
          x
        </button>
      </li>
    </ul>
